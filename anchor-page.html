<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
  <title>Anchor Page</title>
  <script id="purify" src="purify.js"></script>
  <script id="marked" src="marked.js"></script>
  <script id="content-object">
  /* holding object for content - allows multiple scripts to be added :*/
  var $content_details = {};
  </script>
  <!-- content script(s) -->
  <!-- ------------------------
    -- Add as many content scripts as required here. See anchor-content-example.js for details
    --------------------------- -->
  <script id="content" src="content.js"></script>
  <!-- /end content script(s) -->
  <script id="config" src="anchor.js"></script>
  <script id="main">

    function wrap_elements_after_heading( heading ) {
      // Get the level of the current heading
      const _heading_level = parseInt(heading.tagName.charAt(1));

      // Create a wrapper element
      const $wrapper = document.createElement('section');

      // Start wrapping elements
      let $next_element = heading.nextElementSibling;

      while ( $next_element && !is_heading_same_or_higher($next_element, _heading_level) ) {
        const nextSibling = $next_element.nextElementSibling;
        $wrapper.appendChild($next_element);
        $next_element = nextSibling;
      }

      // Insert the wrapper after the heading
      heading.parentNode.insertBefore($wrapper, $next_element);
      $wrapper.insertBefore(heading, $wrapper.firstChild);
    }

    // Helper function to check if the next element is a heading of the same or higher level
    function is_heading_same_or_higher( element, level ) {
      if ( element.tagName.startsWith('H') ) {
        const _element_level = parseInt(element.tagName.charAt(1));
        return _element_level <= level;
      }
      return false;
    }

    window.addEventListener('DOMContentLoaded', () => {
      let
        $parameters,
        _content_locations,
        $loaded_content_object;

      // /////////////////////////////////////////////////////////////////////////////
      // region Content Fallbacks

      // @formatter:off
      $content_details['fallback'] = {title : `${$warnings.fallback.title}`, markdown: /* language=markdown */ `${$warnings.fallback.markdown}${$warnings.available_contents}`,};
      $content_details['missing']  = {title : `${$warnings.missing.title}`, markdown: /* language=markdown */ `${$warnings.missing.markdown}${$warnings.available_contents}`,};
      // @formatter:on
      Object.entries($content_details).forEach(( [ key, $value ] ) => {
        [ 'fallback', 'missing' ].forEach(( _key ) => {
          let _current = (key === _key ? ` <small>(currently viewing)</small>` : '');
          // @formatter:off
          $content_details[_key].markdown = /* language=markdown */
            `${$content_details[_key].markdown}\n- [${$value.title}](\?content\=${key})${_current}`;
          // @formatter:on
        });
      });

      // endregion
      // /////////////////////////////////////////////////////////////////////////////

      // /////////////////////////////////////////////////////////////////////////////
      // region Content Population

      // ---------------------------------------------------------------------
      // region Determine Content

      $parameters = new URLSearchParams(window.location.search);

      // Load the content object from the content parameter:
      $loaded_content_object =
        ($parameters.get('content') === null) ? // is it even present?
        $content_details['missing'] : // no, display notice
        (
          ($content_details[$parameters.get('content')]) ? // does it exist?
          $content_details[$parameters.get('content')] : // yes, load
          $content_details['fallback'] // no, display notice
        )
      ;

      // endregion Determine Content
      // ---------------------------------------------------------------------

      // ---------------------------------------------------------------------
      // region Parse Content

      // Remove zero-width characters: https://github.com/markedjs/marked/issues/2139
      $loaded_content_object.markdown =
        $loaded_content_object.markdown.replace(/^[\u200B\u200C\u200D\u200E\u200F\uFEFF]/, '');

      // Ensure an icon is available:
      let _icon_fallback_path = (_icon_fallback_dir) ? `${_icon_fallback_dir}/${_icon_fallback}` : _icon_fallback;
      $loaded_content_object.icon =
        ($loaded_content_object.icon) ? $loaded_content_object.icon : _icon_fallback_path;

      // map content to locations in DOM:
      _content_locations = [
        // @formatter:off
        { selector: 'title'              , content: $loaded_content_object.title, },
        { selector: 'h1'                 , content: $loaded_content_object.title, },
        { selector: 'header > div'       , content: `\n <img src="${$loaded_content_object.icon}" alt="${$loaded_content_object.title}"/>`, },
        { selector: 'summary'            , content: $loaded_content_object.title, },
        { selector: 'details > pre'      , content: $loaded_content_object.markdown, },
        { selector: 'details > textarea' , content: $loaded_content_object.markdown, },
        { selector: 'article'            , content: DOMPurify.sanitize(marked.parse($loaded_content_object.markdown), $dom_purify_config), }
        // @formatter:on
      ];

      // update the DOM with the mapped content:
      _content_locations.forEach(( $location ) => {
        let
          _e,
          _c = $location.content;
        if ( $location.selector === 'title' ) {
          window.title = _c;
        }
        _e = document.querySelector($location.selector);
        if ( _e ) {
          _e.innerHTML = _c;
        }
      });

      // endregion Parse Content
      // ---------------------------------------------------------------------

      // ---------------------------------------------------------------------
      // region Adjust Content

      // Add target to links
      document.querySelectorAll('a[href*="http"]').forEach(( element ) => {
        element.setAttribute('target', '_blank');
      });

      // Enable grid layout if needed
      if (
        typeof $layout !== 'undefined' &&
        $layout.grid === true
      ) {
        document.querySelector('article').style.display = 'grid';
      }

      // Wrap content between heading tags in a section
      const _arr = [ 2, 3, 4, 5, 6 ];
      _arr.forEach(( _level ) => {
        document.querySelectorAll(`h${_level}`).forEach(function ( element ) {
          wrap_elements_after_heading(element);
        });
      });

      // endregion Adjust Content
      // ---------------------------------------------------------------------

      // endregion Content Population
      // /////////////////////////////////////////////////////////////////////////////

      // /////////////////////////////////////////////////////////////////////////////
      // region CSS Fonts

      _fonts.forEach(( $font ) => {
        // determine if italics are needed:
        let _font_styles = [ 'normal' ];
        if ( $font.italic === true ) {
          _font_styles.push('italic');
        }

        $font.weights.forEach(( _font_weight ) => {
          _font_styles.forEach(( _font_style ) => {
            // compile @font-face CSS
            // @formatter:off
            let _font_face = /* language=css */ `
              @font-face {
                src: local(${$font.family}), url("file:///${_font_dir}/${$font.filenamebase}${_font_weight}.${$font.format}") format('${$font.format}');
                font-weight: ${_font_weight}; font-family: '${$font.family}'; font-style: ${_font_style}; font-display: swap;
              }`;
            // @formatter:on
            document.querySelector('#fonts').innerHTML = document.querySelector('#fonts').innerHTML + _font_face;
          });
        });
      });

      // endregion
      // /////////////////////////////////////////////////////////////////////////////
    });
  </script>
  <style id='fonts'></style>
  <style id='styles'>
    :root {
      color-scheme: light dark;
      --u--base-shade--light: #fefefeff;
      --u--base-shade--dark: #343434ff;
      --u--base-shade--link: #1078bc;

      --u--color--body-background: light-dark(var(--u--base-shade--light), var(--u--base-shade--dark));
      --u--color--body-text: light-dark(var(--u--base-shade--dark), var(--u--base-shade--light));

      --u--color--accent: color-mix(in srgb, var(--u--color--body-text) 10%, transparent 100%);
      --u--color--code-background: color-mix(in srgb, var(--u--color--body-text) 15%, transparent 100%);

      --u--color--link-base: light-dark(var(--u--base-shade--link), color-mix(in srgb, var(--u--base-shade--link), var(--u--base-shade--light)));
      --u--color--link-hover: light-dark(
        color-mix(in srgb, var(--u--base-shade--link) 100%, var(--u--base-shade--light) 20%),
        color-mix(in srgb, var(--u--base-shade--link) 100%, var(--u--base-shade--light) 50%)
      );
      --u--color--btn-bg-base: light-dark(
        color-mix(in srgb, var(--u--base-shade--link) 100%, var(--u--base-shade--light) 15%),
        color-mix(in srgb, var(--u--base-shade--link) 100%, var(--u--base-shade--light) 30%)
      );
      --u--color--btn-bg-hover: light-dark(
        color-mix(in srgb, var(--u--base-shade--link) 100%, var(--u--base-shade--light) 7%),
        color-mix(in srgb, var(--u--base-shade--link) 100%, var(--u--base-shade--light) 17%)
      );

      --u--gutter: 2rem;
      --u--font-family--body: "Roboto";
      --u--font-family--monospace: "Roboto Mono";
    }

    *,
    ::after,
    ::before {
      box-sizing: border-box;
      grid-auto-columns: minmax(0, auto);
      grid-auto-rows: minmax(0, auto);
    }

    html, body {
      font-size: 16px !important;
    }

    body {
      --grid-gutter: minmax(var(--u--gutter), 1fr);
      display: grid;
      grid-template-columns: var(--grid-gutter) minmax(auto, clamp(20rem, 80vw, 75rem)) var(--grid-gutter);
      grid-template-rows: var(--u--gutter) minmax(20rem, auto) var(--grid-gutter);
      grid-template-areas: " . . . " " . content . " " . . . ";
      min-height: 99vh;
      background: var(--u--color--body-background);
      color: var(--u--color--body-text);
      line-height: 1.6;
      font-family: var(--u--font-family--body), sans-serif;
      font-weight: 300;
      font-style: normal;
    }

    header {
      display: flex;
      align-items: stretch;
      justify-content: start;
      flex-direction: row-reverse;
      gap: clamp(0.5rem, 1vw, 2rem);

      & div {
        --size: 1em; /* note(rl): Deliberate `em` use - size should match parent font size. */

        &,
        & img {
          height: var(--size);
          width: var(--size);
          aspect-ratio: 1;
        }

        & img {
          object-fit: contain;
          object-position: center;
        }
      }
    }

    main {
      display: flex;
      flex-direction: column;
      grid-area: content;
    }

    article[style*="display"][style*="grid"] {
      /*display: grid;*/
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: var(--u--gutter);
      row-gap: calc(var(--u--gutter) / 2);
      grid-auto-flow: dense;

      & > :not(section) {
        /* default behaviour - span the page as normal: */
        grid-column: 1/-1;
      }

      & > section {
        --padding: calc(var(--u--gutter) / 3);
        grid-column: auto;
        margin-block: 0;
        min-height: 10rem;
        padding: var(--padding);
        border: 1px solid #88888845;
        border-radius: var(--padding);

        & > h2,
        & > h3,
        & > h4,
        & > h5,
        & > h6 {
          margin-block-start: 0;
        }

        & ol,
        & ul {
          display: flex;
          flex-direction: column;
          align-items: stretch;
          grid-column: unset;
          gap: calc(var(--u--gutter) / 3);
          margin-block-start: 0;
          padding-inline: 0;
        }

        & ol {
          list-style-position: inside;
        }

        & ul {
          list-style: none;
        }

        & a {
          border-radius: 0.5rem;
          display: flex;
          align-items: center;
          justify-content: center;
          padding-block: 0.25rem;
          padding-inline: 0.5rem;
          text-decoration-color: color-mix(in srgb, currentcolor 80%, transparent 100%);

          &,
          &:visited {
            background-color: var(--u--color--btn-bg-base);
            color: var(--u--color--body-text);
          }

          &:hover,
          &:focus,
          &:focus-visible {
            background-color: var(--u--color--btn-bg-hover);
            color: var(--u--color--body-text);
          }
        }
      }
    }

    h1, h2, h3, h4, h5, h6 {
      margin-block: max(2rem, 1em) 1rem;
    }

    h1,
    header > div {
      font-size: max(2rem, 7.5vh);
      line-height: 1;
    }

    p {
      margin-block: 0 1rem;
    }

    a,
    summary {
      &, &:visited {
        color: var(--u--color--link-base);
      }

      &:hover,
      &:focus,
      &:focus-visible {
        color: var(--u--color--link-hover);
      }
    }

    code {
      background-color: var(--u--color--code-background);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding-inline: 0.25em;
    }

    pre, textarea {
      white-space: pre-wrap;
      font-family: var(--u--font-family--monospace), monospace;
      font-size: 0.9325em;

      :not(summary) > & {
        background-color: var(--u--color--accent);
      }
    }

    textarea {
      width: 100%;
      max-width: 100%;
      min-width: 100%;
      min-height: min(75dvh, 20rem);
      max-height: 75dvh;
      padding-block: 0.25rem;
      padding-inline: 0.325rem;
    }

    details {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      margin-block: 1rem;
      background-color: var(--u--color--accent);
      border: 1px solid var(--u--color--accent);

      & summary {
        display: flex;
        flex-direction: row;
        align-items: stretch;
        gap: 0.5em;
        justify-content: start;
        padding: 0.5rem 1rem;
        cursor: pointer;
        user-select: none;
      }

      & summary::after {
        content: "Raw Markdown";
        display: flex;
        order: -5;
      }

      & summary::before {
        --size: 1em;
        display: flex;
        order: -10;
        width: var(--size);
        height: var(--size);
        font-family: var(--u--font-family--monospace), monospace;
        color: color-mix(in srgb, var(--u--color--body-text) 100%, var(--u--color--body-background) 100%);
      }

      &:not([open]) summary::before {
        content: "↳";
      }

      &[open] summary::before {
        content: "↴";
      }

      :is(footer) & summary {
        color: color-mix(in srgb, var(--u--color--body-text) 100%, var(--u--color--body-background) 100%);

        &::after {
          color: var(--u--color--link-base);
        }

        &:hover,
        &:focus,
        &:focus-visible {
          color: color-mix(in srgb, var(--u--color--body-text) 100%, var(--u--color--body-background) 100%);

          &::after {
            color: var(--u--color--link-hover);
          }
        }
      }

      & > :not(summary) {
        background-color: var(--u--color--body-background);
        padding: 0 1rem 1rem;
      }

      & > :nth-child(2) {
        margin-block-start: 0;
        padding-block-start: 1rem;
      }

      & > :last-child {
        margin-block-end: 0;
      }
    }

    /* layout */
    :where(main) > :where(section) {
      & > header,
      & > main,
      & > footer {
        & > :first-child {
          margin-block-start: 0rem;
        }
      }

      & > footer {
        font-size: 0.75rem;
        padding-block-start: 4rem;
      }
    }
  </style>
</head>
<body>
<main>
  <section>
    <header>
      <h1></h1>
      <div></div>
    </header>
    <article></article>
    <footer>
      <details>
        <summary></summary>
        <textarea></textarea>
      </details>
    </footer>
  </section>
</main>
</body>
</html>
